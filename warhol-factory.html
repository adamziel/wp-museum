<style>
:root{--ink:#080706;--paper:#fff7df;--hot:#ff2f86;--blue:#2451ff;--yellow:#ffd51f;--green:#16d979;--orange:#ff6a1f;--violet:#7d43ff;--cream:#fff6df;--room:#111;--accent:#ff2f86;--ease:cubic-bezier(.2,.9,.1,1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow:hidden}body{font-family:"Bricolage Grotesque",system-ui,sans-serif;background:#090807;color:var(--paper)}
body::after{content:"";position:fixed;inset:0;z-index:50;pointer-events:none;opacity:.18;mix-blend-mode:overlay;background-image:radial-gradient(#fff .6px,transparent .8px);background-size:5px 5px}.home{position:fixed;z-index:60;top:14px;left:14px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:5px 5px 0 #000;padding:9px 12px;text-decoration:none;font:900 12px/1 "Space Mono";letter-spacing:.08em;text-transform:uppercase}.home:hover,.home:focus-visible{transform:translate(-1px,-1px);box-shadow:7px 7px 0 #000;outline:2px solid var(--yellow);outline-offset:2px}.sr{position:absolute;clip:rect(0 0 0 0);clip-path:inset(50%);width:1px;height:1px;overflow:hidden;white-space:nowrap}
.shell{position:fixed;inset:0;background:var(--room);transition:background .6s var(--ease)}.room{position:absolute;inset:0;display:none;overflow:hidden;background:var(--room);color:var(--ink)}.room.is-live{display:block}.room.is-entering{animation:roomIn .7s var(--ease) both}.room.is-leaving{display:block;animation:roomOut .45s var(--ease) both}@keyframes roomIn{0%{opacity:0;transform:scale(1.04) translateY(18px);clip-path:circle(0 at var(--wipe-x,50%) var(--wipe-y,50%));filter:blur(8px) saturate(1.8)}100%{opacity:1;transform:none;clip-path:circle(150% at var(--wipe-x,50%) var(--wipe-y,50%));filter:none}}@keyframes roomOut{to{opacity:0;transform:scale(.96) translateY(-18px);filter:blur(6px) saturate(2)}}
.hud{position:fixed;z-index:55;left:18px;right:18px;bottom:16px;display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:end;pointer-events:none}.hud>*{pointer-events:auto}.navbtn,.play{border:2px solid #000;background:var(--paper);color:#000;box-shadow:5px 5px 0 #000;text-decoration:none;font:900 13px/1 "Space Mono";text-transform:uppercase;letter-spacing:.06em;padding:12px 14px;cursor:pointer}.navbtn:hover,.play:hover,.navbtn:focus-visible,.play:focus-visible{transform:translate(-1px,-1px);box-shadow:7px 7px 0 #000;outline:2px solid var(--accent);outline-offset:2px}.scrubber{align-self:stretch;display:flex;align-items:end;gap:7px;min-width:0;overflow:auto;padding:0 4px 5px}.dot{position:relative;flex:1 0 42px;max-width:92px;height:48px;border:2px solid #000;background:var(--paper);box-shadow:3px 3px 0 #000;cursor:pointer;color:#000;display:grid;place-items:center;font:900 12px/1 "Space Mono"}.dot[aria-current="true"]{background:var(--accent);height:64px}.dot span{transform:rotate(-8deg)}.dot:hover{height:58px}.plate{position:absolute;z-index:4;max-width:min(520px,calc(100vw - 28px));background:rgba(255,247,223,.94);border:3px solid #000;box-shadow:10px 10px 0 #000;color:#090807;padding:18px}.plate h1{margin:0;font-family:"Archivo Black";font-size:clamp(40px,7vw,92px);letter-spacing:-.08em;line-height:.78;text-transform:uppercase}.plate h1 small{display:block;font:700 clamp(18px,2vw,28px)/1 "Bebas Neue";letter-spacing:.08em;color:var(--accent)}.plate p{margin:10px 0 0;font-size:clamp(15px,1.5vw,18px);line-height:1.28}.plate b{font-weight:900}.tag{display:inline-flex;border:2px solid #000;background:var(--accent);box-shadow:3px 3px 0 #000;padding:5px 8px;margin:0 6px 10px 0;font:900 12px/1 "Space Mono";text-transform:uppercase}.meta{position:absolute;z-index:5;font:900 13px/1 "Space Mono";letter-spacing:.08em;text-transform:uppercase;color:var(--paper);text-shadow:2px 2px 0 #000}.big{font-family:"Archivo Black";letter-spacing:-.12em;line-height:.75}.mono{font-family:"VT323",monospace}.marquee{position:absolute;white-space:nowrap;font-family:"Bebas Neue";letter-spacing:.06em;text-transform:uppercase}
/* 1.2 Mingus — plugin zine workbench */
.mingus{--room:#ffcf19;--accent:#ff2f86;background:repeating-linear-gradient(8deg,#ffcf19 0 26px,#ffd94d 26px 52px)}.mingus .plate{left:7vw;bottom:18vh;transform:rotate(-2deg)}.desk{position:absolute;inset:8% 6% 17%;background:#f8ead0;border:4px solid #000;box-shadow:16px 16px 0 #000;transform:rotate(1deg)}.desk::before{content:"";position:absolute;inset:22px;border:3px dashed #000}.plug{position:absolute;border:3px solid #000;box-shadow:7px 7px 0 #000;background:#fff;font:900 clamp(20px,3vw,46px)/.9 "Archivo Black";display:grid;place-items:center;text-align:center;padding:10px;text-transform:uppercase}.plug.a{left:14%;top:14%;width:29%;height:29%;color:var(--blue);transform:rotate(-12deg)}.plug.b{right:10%;top:12%;width:32%;height:20%;background:var(--hot);transform:rotate(8deg)}.plug.c{left:33%;bottom:13%;width:27%;height:22%;background:var(--green);transform:rotate(4deg)}.plug.d{right:12%;bottom:14%;width:18%;aspect-ratio:1;border-radius:50%;background:var(--blue);color:#fff;transform:rotate(-8deg)}.cable{position:absolute;border:5px solid #000;border-color:#000 transparent transparent #000;border-radius:50%;width:38%;height:38%;left:39%;top:34%;transform:rotate(12deg)}
/* 1.5 Strayhorn — Kubrick blue swimming pool */
.strayhorn{--room:#bfe5ff;--accent:#1e50ff;background:linear-gradient(#79c4ff,#dff3ff)}.strayhorn .plate{right:7vw;top:14vh;transform:rotate(2deg)}.pool{position:absolute;left:6%;right:8%;bottom:10%;height:62%;border:5px solid #000;box-shadow:14px 14px 0 #000;background:linear-gradient(#3a9fe8 0 28%,#fff 28% 33%,#f7f7f7 33%)}.pool::before{content:"Kubrick";position:absolute;left:22px;top:22px;font-family:"Fraunces";font-size:clamp(52px,9vw,130px);font-weight:800;color:#fff;text-shadow:5px 5px 0 #135c91}.pool .page{position:absolute;background:#fff;border:4px solid #000;box-shadow:8px 8px 0 #000}.pool .page.one{left:9%;bottom:10%;width:32%;height:42%;transform:rotate(-4deg)}.pool .page.two{right:9%;bottom:14%;width:22%;height:50%;transform:rotate(6deg)}.pool i{display:block;height:14px;background:#111;margin:17px}.pool i:first-child{height:28px;background:var(--hot);width:72%}
/* 2.0 Duke — glossy appliance showroom */
.duke{--room:#ff7b20;--accent:#ff6a1f;background:radial-gradient(circle at 25% 18%,#fff 0 5%,transparent 6%),linear-gradient(135deg,#ff6a1f,#ffd51f)}.duke .plate{left:7vw;top:12vh;transform:rotate(-1deg)}.appliance{position:absolute;right:7%;bottom:13%;width:min(52vw,680px);height:58%;border:5px solid #000;border-radius:36px;background:linear-gradient(145deg,#fff,#d8f7ff 25%,#1e50ff 62%,#111);box-shadow:18px 18px 0 #000;overflow:hidden}.appliance::before{content:"WYSIWYG";position:absolute;left:8%;top:9%;font-family:"Archivo Black";font-size:clamp(38px,6vw,96px);letter-spacing:-.08em;color:#fff;text-shadow:5px 5px 0 var(--hot)}.knob{position:absolute;border-radius:50%;border:4px solid #000;background:radial-gradient(circle at 30% 25%,#fff,#ffd51f 45%,#ff2f86);box-shadow:7px 7px 0 #000}.knob.one{left:11%;bottom:13%;width:110px;max-width:16vw;aspect-ratio:1}.knob.two{right:13%;bottom:16%;width:86px;max-width:13vw;aspect-ratio:1}.shineband{position:absolute;inset:0;background:linear-gradient(110deg,transparent 0 18%,rgba(255,255,255,.7) 20% 28%,transparent 31%);mix-blend-mode:screen}
/* 2.7 Coltrane — impossible media-player skin */
.coltrane{--room:#09051d;--accent:#7d43ff;background:radial-gradient(circle at 55% 40%,#433cff,#0b071f 58%,#00ffc2)}.coltrane .plate{right:6vw;bottom:15vh;transform:rotate(2deg)}.skin{position:absolute;left:7%;top:14%;width:58%;height:58%;clip-path:polygon(8% 18%,31% 1%,76% 5%,98% 31%,84% 78%,54% 98%,15% 86%,0 44%);background:linear-gradient(145deg,#f7ffff,#79dfff 20%,#262a8e 54%,#080706);border:5px solid #000;box-shadow:18px 18px 0 rgba(0,0,0,.65)}.skin::before{content:"2.7";position:absolute;left:12%;top:18%;font-family:"Archivo Black";font-size:clamp(70px,13vw,180px);color:#fff;text-shadow:7px 7px 0 var(--hot)}.orb{position:absolute;left:34%;bottom:16%;width:120px;aspect-ratio:1;border-radius:50%;border:5px solid #000;background:radial-gradient(circle at 30% 25%,#fff,#00ffc2 40%,#111 70%)}.eq{position:absolute;left:10%;bottom:12%;display:flex;gap:8px;align-items:end}.eq i{width:18px;background:var(--yellow);border:2px solid #000;height:var(--h)}.eq i:nth-child(1){--h:42px}.eq i:nth-child(2){--h:98px}.eq i:nth-child(3){--h:62px}.eq i:nth-child(4){--h:132px}.eq i:nth-child(5){--h:78px}
/* 3.0 Thelonious — social control room */
.thelonious{--room:#18c86a;--accent:#16d979;background:#16d979}.thelonious .plate{left:8vw;top:12vh;transform:rotate(-2deg)}.control{position:absolute;right:5%;top:9%;bottom:12%;width:54%;display:grid;grid-template-columns:1.1fr .7fr 1fr;grid-template-rows:.7fr 1fr .85fr;gap:12px}.widget{border:4px solid #000;background:var(--paper);box-shadow:7px 7px 0 #000;padding:14px;overflow:hidden}.widget.hero{grid-row:span 2;background:var(--yellow)}.widget.hero b{font-family:"Archivo Black";font-size:clamp(52px,8vw,120px);letter-spacing:-.1em}.widget.menu{grid-column:span 2;background:var(--blue);color:#fff;font:900 28px/1 "Bebas Neue"}.faces{display:flex;flex-wrap:wrap;gap:7px}.faces i{width:35px;aspect-ratio:1;border-radius:50%;border:3px solid #000;background:var(--hot)}.lines i{display:block;height:15px;background:#000;margin:9px 0}.lines i:nth-child(2){width:70%;background:var(--hot)}.lines i:nth-child(3){width:86%;background:var(--blue)}
/* 3.8 Parker — flat admin stamp sheet */
.parker{--room:#f1f1f1;--accent:#ff2f86;background:#f1f1f1}.parker .plate{right:7vw;top:16vh;transform:rotate(1deg)}.stampgrid{position:absolute;left:5%;bottom:9%;width:58%;height:72%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:10px}.stamp{border:4px solid #000;box-shadow:6px 6px 0 #000;background:var(--c);display:grid;place-items:center;font-family:"Archivo Black";font-size:clamp(26px,5vw,82px);color:#fff;text-shadow:3px 3px 0 rgba(0,0,0,.35)}.stamp.big{grid-column:span 2;grid-row:span 2;background:#222;color:var(--hot);font-size:clamp(78px,12vw,170px)}.stamp:nth-child(2){--c:#0073aa}.stamp:nth-child(3){--c:#d54e21}.stamp:nth-child(4){--c:#46b450}.stamp:nth-child(5){--c:#826eb4}.stamp:nth-child(6){--c:#00a0d2}.stamp:nth-child(7){--c:#111}.stamp:nth-child(8){--c:#ff2f86}.stamp:nth-child(9){--c:#ffd51f;color:#111}
/* 4.4 Clifford — responsive photo lab */
.clifford{--room:#caffdf;--accent:#2451ff;background:linear-gradient(135deg,#1e50ff,#16d979)}.clifford .plate{left:6vw;bottom:13vh;transform:rotate(2deg)}.lab{position:absolute;right:6%;top:9%;width:58%;height:74%;border:5px solid #000;box-shadow:16px 16px 0 #000;background:#fff;transform:rotate(-1deg)}.device{position:absolute;border:5px solid #000;background:#fff;box-shadow:9px 9px 0 #000;overflow:hidden}.device::before{content:"";position:absolute;inset:10%;background:linear-gradient(135deg,var(--yellow),var(--hot));border:3px solid #000}.device::after{content:"";position:absolute;left:14%;right:14%;bottom:14%;height:18%;background:repeating-linear-gradient(90deg,#000 0 12px,transparent 12px 22px)}.desktop{left:8%;top:12%;width:58%;height:52%}.phone{right:9%;top:16%;width:22%;height:58%;border-radius:24px}.tablet{left:29%;bottom:9%;width:40%;height:28%;border-radius:12px}.srcset{position:absolute;left:8%;top:8%;z-index:2;background:var(--paper);border:3px solid #000;box-shadow:5px 5px 0 #000;padding:8px;font-family:"Archivo Black";font-size:clamp(34px,5vw,70px);color:var(--blue);transform:rotate(-6deg)}
/* 4.7 Vaughan — REST cinema premiere */
.vaughan{--room:#060606;--accent:#ff6a1f;background:#060606;color:#fff}.vaughan .plate{right:6vw;bottom:12vh;transform:rotate(-1deg)}.vaughan .plate{background:#fff7df;color:#080706}.cinema{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.68)),radial-gradient(circle at 65% 34%,#ff6a1f,transparent 30%),linear-gradient(135deg,#141414,#000)}.cinema::before{content:"REST API";position:absolute;left:7%;top:17%;font-family:"Archivo Black";font-size:clamp(58px,11vw,160px);letter-spacing:-.08em;line-height:.78;color:var(--yellow);text-shadow:7px 7px 0 var(--hot)}.code{position:absolute;left:8%;right:42%;bottom:14%;border:3px solid var(--yellow);background:rgba(0,0,0,.78);box-shadow:0 0 40px rgba(255,106,31,.45);padding:20px;font-family:"VT323";font-size:clamp(24px,3vw,48px);color:#9cffc8}.premiere{position:absolute;right:8%;top:13%;border:3px solid #fff;padding:10px 16px;font-family:"Bebas Neue";font-size:clamp(42px,6vw,96px);transform:rotate(7deg)}
/* 5.0 Bebo — Gutenberg construction yard */
.bebo{--room:#7d43ff;--accent:#7d43ff;background:#7d43ff}.bebo .plate{left:7vw;top:14vh;transform:rotate(1deg)}.yard{position:absolute;right:5%;bottom:8%;width:58%;height:74%;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(5,1fr);gap:10px;transform:rotate(-1deg)}.block{border:4px solid #000;box-shadow:6px 6px 0 #000;background:var(--paper);position:relative}.block::before{content:attr(data-b);position:absolute;left:9px;top:7px;font:900 12px/1 "Space Mono";color:rgba(0,0,0,.55)}.block.title{grid-column:span 4;grid-row:span 2;background:var(--yellow);font-family:"Archivo Black";font-size:clamp(44px,8vw,120px);letter-spacing:-.11em;display:grid;place-items:center}.block.image{grid-column:span 2;grid-row:span 3;background:linear-gradient(135deg,var(--hot),var(--blue))}.block.quote{grid-column:span 3;background:#111;color:#fff;display:grid;place-items:center;font-family:"Bebas Neue";font-size:clamp(38px,5vw,76px)}.block.accent{background:var(--green)}
/* 5.9 Josephine — FSE fashion blueprint */
.josephine{--room:#0a37a8;--accent:#16d979;background:#0a37a8;color:#dff5ff}.josephine .plate{right:6vw;top:12vh;transform:rotate(2deg)}.blueprint{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.16) 1px,transparent 1px);background-size:34px 34px}.dress{position:absolute;left:11%;top:12%;width:34%;height:72%;border:4px solid #dff5ff;clip-path:polygon(50% 0,76% 19%,63% 42%,90% 100%,10% 100%,37% 42%,24% 19%);background:rgba(22,217,121,.35);box-shadow:10px 10px 0 rgba(0,0,0,.45)}.tokens{position:absolute;right:8%;bottom:12%;width:42%;display:grid;gap:12px}.token{border:3px solid #dff5ff;background:rgba(255,255,255,.08);padding:12px 14px;font-family:"VT323";font-size:clamp(22px,3vw,42px);box-shadow:6px 6px 0 rgba(0,0,0,.35)}.token:nth-child(2){margin-left:10%}.token:nth-child(3){margin-left:20%}.blue-title{position:absolute;left:10%;bottom:7%;font-family:"Archivo Black";font-size:clamp(58px,10vw,150px);letter-spacing:-.1em;line-height:.78;color:var(--yellow);text-shadow:6px 6px 0 var(--hot)}
@media(max-width:880px){html,body{overflow:auto}.shell{position:relative;min-height:100svh}.room{position:relative;min-height:100svh}.room:not(.is-live){display:none}.hud{position:sticky;bottom:0;background:rgba(0,0,0,.72);padding:10px;left:0;right:0;grid-template-columns:auto 1fr auto auto}.plate{left:18px!important;right:18px!important;top:auto!important;bottom:92px!important;transform:rotate(0deg)!important}.desk,.pool,.appliance,.skin,.control,.stampgrid,.lab,.yard{inset:7% 5% 38%!important;width:auto!important;height:auto!important}.code{right:8%;bottom:34%}.tokens{width:58%;right:5%;bottom:34%}.dress{left:8%;height:54%}.blue-title{bottom:34%}.home{position:absolute}}@media(max-width:560px){.hud{grid-template-columns:1fr;align-items:stretch}.scrubber{order:-1}.dot{flex-basis:56px}.navbtn,.play{text-align:center}.plate{bottom:160px!important}.plate h1{font-size:42px}.control{grid-template-columns:1fr 1fr}.widget.menu{grid-column:span 2}.appliance{border-radius:20px}.skin{width:auto}.premiere{right:5%;top:12%;font-size:42px}.code{font-size:26px}.yard{gap:6px}.block.title{font-size:44px}.home{font-size:11px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.room.is-entering,.room.is-leaving{animation:none}.shell,.tab,.dot{transition:none}}
</style>

<script>
const releases=[
{id:'mingus',v:'1.2',code:'Mingus',date:'May 22, 2004',year:'2004',musician:'Charles Mingus',why:'Plugin architecture arrived, turning WordPress from a blog script into a platform other people could extend.',trivia:'The web was still full of tiny badges, RSS buttons, and sidebars that felt like apartment walls covered in stickers.'},
{id:'strayhorn',v:'1.5',code:'Strayhorn',date:'February 17, 2005',year:'2005',musician:'Billy Strayhorn',why:'Themes and Pages landed, giving sites structure and swappable visual identity.',trivia:'Kubrick-blue gradients were everywhere; a default theme could suddenly define an era.'},
{id:'duke',v:'2.0',code:'Duke',date:'December 31, 2005',year:'2005',musician:'Duke Ellington',why:'The admin got richer with WYSIWYG editing, image uploading, and Akismet bundled for comment-spam defense.',trivia:'Web 2.0 had glossy buttons and rounded corners; everything looked newly shrink-wrapped.'},
{id:'coltrane',v:'2.7',code:'Coltrane',date:'December 10, 2008',year:'2008',musician:'John Coltrane',why:'The modern dashboard pattern appeared: redesigned navigation, sticky tools, and one-click core upgrades.',trivia:'Vista chrome, media-player skins, and glossy widgets made interfaces feel like shiny hardware.'},
{id:'thelonious',v:'3.0',code:'Thelonious',date:'June 17, 2010',year:'2010',musician:'Thelonious Monk',why:'Custom post types, menus, multisite merging, and Twenty Ten made WordPress feel like a CMS for anything.',trivia:'The social web was becoming a dashboard of feeds, badges, avatars, and status boxes.'},
{id:'parker',v:'3.8',code:'Parker',date:'December 12, 2013',year:'2013',musician:'Charlie Parker',why:'MP6 became the responsive, flat, high-contrast admin design that shaped WordPress for years.',trivia:'Flat design arrived like somebody peeled the gloss off every button overnight.'},
{id:'clifford',v:'4.4',code:'Clifford',date:'December 8, 2015',year:'2015',musician:'Clifford Brown',why:'Responsive images and oEmbed posts made WordPress friendlier to mobile screens and richer sharing.',trivia:'Responsive design stopped being a trick and became the default moral position of the web.'},
{id:'vaughan',v:'4.7',code:'Vaughan',date:'December 6, 2016',year:'2016',musician:'Sarah Vaughan',why:'REST API endpoints entered core, and Twenty Seventeen brought cinematic business-site energy.',trivia:'Hero videos, big type, and API dreams made every homepage feel like a product launch.'},
{id:'bebo',v:'5.0',code:'Bebo',date:'December 6, 2018',year:'2018',musician:'Bebo Valdés',why:'Gutenberg shipped: editing became blocks, and WordPress began its most dramatic interface transformation.',trivia:'Brutalist grids and design-system rectangles were suddenly fashionable enough to be controversial.'},
{id:'josephine',v:'5.9',code:'Josephine',date:'January 25, 2022',year:'2022',musician:'Joséphine Baker',why:'Full Site Editing and block themes moved templates, global styles, and site structure into the editor.',trivia:'Design tools and websites started speaking the same language: tokens, systems, palettes, and reusable parts.'}
];
const treatments={

strayhorn:`<div class="pool"><div class="page one"><i></i><i></i><i></i><i></i></div><div class="page two"><i></i><i></i><i></i></div></div>`,

coltrane:`<div class="skin"></div><div class="orb"></div><div class="eq"><i></i><i></i><i></i><i></i><i></i></div>`,
thelonious:`<div class="control"><div class="widget hero"><b>3.0</b><br>CMS</div><div class="widget menu">menus · multisite</div><div class="widget"><div class="faces"><i></i><i></i><i></i><i></i><i></i><i></i></div></div><div class="widget"><div class="lines"><i></i><i></i><i></i></div></div><div class="widget"><b>Twenty Ten</b><br>theme as product</div><div class="widget"><b>post types</b><br>anything machine</div></div>`,

clifford:`<div class="lab"><span class="srcset">srcset</span><div class="device desktop"></div><div class="device phone"></div><div class="device tablet"></div></div>`,

josephine:`<div class="blueprint"><div class="dress"></div><div class="tokens"><div class="token">styles.color.palette</div><div class="token">templates/index.html</div><div class="token">parts/header.html</div><div class="token">theme.json</div></div><div class="blue-title">5.9<br>Josephine</div></div>`
};
const shell=document.getElementById('shell'), scrubber=document.getElementById('scrubber'), play=document.getElementById('play'), prev=document.getElementById('prev'), next=document.getElementById('next');let index=0,busy=false;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function playground(v){return `https://playground.wordpress.net/?wp=${encodeURIComponent(v)}`}
function plate(r){return `<aside class="plate"><span class="tag">${esc(r.year)}</span><span class="tag">${esc(r.date)}</span><h1><small>WordPress ${esc(r.v)}</small>${esc(r.code)}</h1><p><b>Musician:</b> ${esc(r.musician)}</p><p><b>Why it mattered:</b> ${esc(r.why)}</p><p><b>Trivia:</b> ${esc(r.trivia)}</p></aside>`}
function room(r){return `<section class="room ${esc(r.id)}" data-id="${esc(r.id)}" aria-label="WordPress ${esc(r.v)} ${esc(r.code)}"><div class="meta" style="left:calc(50% - 70px);top:22px">${esc(r.v)} · ${esc(r.code)}</div>${treatments[r.id]}${plate(r)}</section>`}
shell.innerHTML=releases.map(room).join('');releases.forEach((r,i)=>{const b=document.createElement('button');b.className='dot';b.type='button';b.innerHTML=`<span>${r.v}</span>`;b.title=`WordPress ${r.v} ${r.code}`;b.addEventListener('click',e=>go(i,e));scrubber.appendChild(b)});
function sync(){const r=releases[index];document.body.dataset.room=r.id;play.href=playground(r.v);play.textContent=`Play ${r.v}`;[...scrubber.children].forEach((b,i)=>b.setAttribute('aria-current',i===index?'true':'false'));prev.textContent=index===0?'← last':'← previous';next.textContent=index===releases.length-1?'first →':'next →'}
function go(i,e){if(busy)return;const old=shell.querySelector('.room.is-live');index=(i+releases.length)%releases.length;const fresh=shell.querySelectorAll('.room')[index];if(old===fresh)return;busy=true;if(e){document.documentElement.style.setProperty('--wipe-x',`${e.clientX||innerWidth/2}px`);document.documentElement.style.setProperty('--wipe-y',`${e.clientY||innerHeight/2}px`)}sync();old?.classList.add('is-leaving');fresh.classList.add('is-live','is-entering');setTimeout(()=>{old?.classList.remove('is-live','is-leaving');fresh.classList.remove('is-entering');busy=false},720)}
prev.addEventListener('click',e=>go(index-1,e));next.addEventListener('click',e=>go(index+1,e));addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(index+1,e);if(e.key==='ArrowLeft')go(index-1,e)});shell.querySelector('.room').classList.add('is-live');sync();
</script>
